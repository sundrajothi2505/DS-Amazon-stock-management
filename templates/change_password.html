{% extends "base.html" %}
{% block title %}Change password — DS Amazon Stock Management{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Change password</h1>
    <p class="page-sub">Update the password for your own login.</p>
  </div>
</header>

<form method="post" class="form-panel stack form-panel-narrow">
  <label>
    <span>Current password</span>
    <input type="password" name="current_password" required autofocus>
  </label>
  <label>
    <span>New password</span>
    <input type="password" name="new_password" minlength="6" required>
  </label>
  <label>
    <span>Confirm new password</span>
    <input type="password" name="confirm_password" minlength="6" required>
  </label>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Change password</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-text">Cancel</a>
  </div>
</form>
{% endblock %}
