{% extends "base.html" %}
{% block title %}Log movement — DS Amazon Stock Management{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Log a movement</h1>
    <p class="page-sub">Every change to stock goes through here, so nothing moves without a record.</p>
  </div>
</header>

<form method="post" class="form-panel stack">
  <label>
    <span>Product</span>
    <div class="searchable-select" data-options-id="product-options-data">
      <input type="text" class="ss-input" placeholder="Search by SKU or name…" autocomplete="off">
      <input type="hidden" name="product_id" class="ss-hidden-value"
             value="{{ (form.product_id if form else preselect) or '' }}">
      <div class="ss-dropdown" hidden></div>
    </div>
  </label>
  <script type="application/json" id="product-options-data">{{ products_js | tojson }}</script>

  <div>
    <span class="field-label">What happened?</span>
    <div class="tile-group">
      <div class="tile-col">
        <span class="tile-col-label">Stock coming in</span>
        <input type="radio" id="t-received" name="type" value="received" class="tile-radio" {{ 'checked' if form and form.type == 'received' }}>
        <label for="t-received" class="tile tile-in">
          <span class="tile-sign">+</span>
          <span class="tile-text">Received<br><small>From supplier</small></span>
        </label>

        <input type="radio" id="t-returned" name="type" value="returned" class="tile-radio" {{ 'checked' if form and form.type == 'returned' }}>
        <label for="t-returned" class="tile tile-in">
          <span class="tile-sign">+</span>
          <span class="tile-text">Returned<br><small>Customer return</small></span>
        </label>

        <input type="radio" id="t-adj-in" name="type" value="adjustment_in" class="tile-radio" {{ 'checked' if form and form.type == 'adjustment_in' }}>
        <label for="t-adj-in" class="tile tile-in">
          <span class="tile-sign">+</span>
          <span class="tile-text">Adjustment<br><small>Manual correction</small></span>
        </label>
      </div>
      <div class="tile-col">
        <span class="tile-col-label">Stock going out</span>
        <input type="radio" id="t-shipped" name="type" value="shipped" class="tile-radio" {{ 'checked' if (form and form.type == 'shipped') or not form }}>
        <label for="t-shipped" class="tile tile-out">
          <span class="tile-sign">&minus;</span>
          <span class="tile-text">Shipped<br><small>Sold on Amazon</small></span>
        </label>

        <input type="radio" id="t-damaged" name="type" value="damaged" class="tile-radio" {{ 'checked' if form and form.type == 'damaged' }}>
        <label for="t-damaged" class="tile tile-out">
          <span class="tile-sign">&minus;</span>
          <span class="tile-text">Damaged<br><small>Written off</small></span>
        </label>

        <input type="radio" id="t-adj-out" name="type" value="adjustment_out" class="tile-radio" {{ 'checked' if form and form.type == 'adjustment_out' }}>
        <label for="t-adj-out" class="tile tile-out">
          <span class="tile-sign">&minus;</span>
          <span class="tile-text">Adjustment<br><small>Manual correction</small></span>
        </label>
      </div>
    </div>
  </div>

  <div class="form-row">
    <label>
      <span>Quantity</span>
      <input type="number" name="quantity" min="1" step="1" value="{{ form.quantity if form else '' }}" required autofocus>
    </label>
    <label>
      <span>Reference <em>(optional)</em></span>
      <input type="text" name="reference" value="{{ form.reference if form else '' }}" placeholder="Order ID, shipment ID, etc.">
    </label>
  </div>

  <label>
    <span>Notes <em>(optional)</em></span>
    <textarea name="notes" rows="2">{{ form.notes if form else '' }}</textarea>
  </label>

  <label class="checkbox-row">
    <input type="checkbox" name="log_another" value="1">
    <span>Log another entry after this one</span>
  </label>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save entry</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-text">Cancel</a>
  </div>
</form>
{% endblock %}
